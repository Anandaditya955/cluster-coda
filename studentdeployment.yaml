apiVersion: apps/v1
kind: Deployment

metadata:
  name: studentapp-deployment
  namespace: prod-ns

spec:
  replicas: 2

  selector:
    matchLabels:
      app: studentapp

  template:
    metadata:
      labels:
        app: studentapp

    spec:
      containers:
        - name: studentapp-container
          image: anandaditya955/studentapp:v2

          ports:
            - containerPort: 5978

          envFrom:
            - configMapRef:
                name: aditya-configure

            - secretRef:
                name: student-secret

          env:
            - name: FLASK_ENV
              value: production

            - name: APP_PORT
              value: "5978"

          volumeMounts:
            - name: student-storage
              mountPath: /app/data

      volumes:
        - name: student-storage
          persistentVolumeClaim:
            claimName: studentapp-pvc

---
apiVersion: v1
kind: Service

metadata:
  name: studentapp-service
  namespace: prod-ns

spec:
  selector:
    app: studentapp

  ports:
    - protocol: TCP
      port: 5978
      targetPort: 5978

  type: LoadBalancer